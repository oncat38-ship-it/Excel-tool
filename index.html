<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel はじめの一歩</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f9;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.7}
header{background:#217346;color:white;padding:24px 18px}header>div,main{max-width:960px;margin:auto}
.logo{font-size:25px;font-weight:700}.sub{font-size:13px;opacity:.9}
nav{margin-top:15px}nav a{color:white;text-decoration:none;margin-right:12px;font-size:14px}
main{padding:25px 15px 60px}.hero,.detail,.notice{background:white;border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 3px 14px #0000000b}
h1{margin-top:0;font-size:28px}h2{margin-top:28px;font-size:21px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}
.card{background:white;border:1px solid #e1e6e3;border-radius:12px;padding:17px;text-decoration:none;color:#222}.card:hover{box-shadow:0 4px 12px #0001}
.num{font-size:12px;color:#217346;font-weight:bold}.card h3{margin:7px 0 3px;font-size:17px}.card p{margin:0;color:#666;font-size:14px}
.btn{display:inline-block;background:#217346;color:white;text-decoration:none;padding:9px 14px;border-radius:7px}.back{color:#217346;text-decoration:none}
.simple{background:#eef7f1;border-left:4px solid #217346;padding:15px;border-radius:5px}.tip{background:#fff7df;border-left:4px solid #d59a20;padding:15px;border-radius:5px}
.page{display:none}
footer{text-align:center;color:#777;font-size:12px;padding:20px}
</style>
</head>
<body>
<header><div>
<div class="logo">Excel はじめの一歩</div>
<div class="sub">Excelを全部覚えるのではなく、「やりたいこと」から少しずつ。</div>
<nav><a href="#home">ホーム</a><a href="#list">操作一覧</a></nav>
</div></header>

<main>
<section id="home" class="page">
<div class="hero">
<h1>まずは、この操作から。</h1>
<p>Excelにはたくさんの機能があります。でも、最初から全部覚える必要はありません。</p>
<p>ここでは「Excelを使うなら最初に知っておくと便利な操作」を、少しずつ紹介します。</p>
</div>
<h2>最初に覚えておきたい操作</h2>
<div class="cards" id="homeCards"></div>
<div class="notice"><b>もっと探したい？</b><p>基本操作を目的別にまとめた一覧から探せます。</p><a class="btn" href="#list">操作一覧を見る →</a></div>
</section>

<section id="list" class="page">
<a class="back" href="#home">← ホームへ戻る</a>
<div class="hero"><h1>Excelの操作一覧</h1><p>「何を覚えればいいの？」というときは、ここから探してください。</p></div>
<div id="listCards"></div>
</section>

<section id="detail" class="page detail"></section>
</main>
<footer>Excel はじめの一歩・試作版</footer>

<script>
const items=[
["セルに文字・数字を入力する","入力・編集","セルをクリックして文字や数字を入力します。Excelのほとんどすべての作業はここから始まります。","Excelのマス目一つ一つを「セル」と呼びます。セルをクリックして文字や数字を入力し、Enterキーで確定します。文字だけでなく、数字、日付、時刻なども入力できます。"],
["セルを選択する","入力・編集","クリックで1つ、ドラッグで複数のセルを選択できます。操作の対象を決める基本操作です。","文字を入力する、色を変える、コピーするなど、何か操作をするときは対象を選択するのが基本です。複数セルを選べば、まとめて書式を設定したりコピーしたりできます。"],
["コピー・貼り付け","入力・編集","セルの内容を別の場所へ複製できます。表を作るときによく使います。","コピーしたいセルを選択し、コピーしてから貼り付け先を選びます。代表的なショートカットはCtrl+CとCtrl+Vです。値だけ、書式だけなど貼り付け方を選べる場合もあります。"],
["列の幅・行の高さを変える","見た目を整える","文字が見切れている、表が狭い・広いときに、列や行の大きさを調整します。","列番号の境界線をドラッグすると列幅を変更できます。行も同様です。境界線をダブルクリックすると内容に合わせて自動調整できる場合があります。"],
["文字の大きさ・色・位置を変える","見た目を整える","文字サイズ、太字、文字色、背景色、左右中央揃えなどで資料を見やすくします。","ホームタブには文字サイズ、太字、文字色、塗りつぶし、配置などがまとまっています。重要な項目だけを強調すると情報が伝わりやすくなります。"],
["セルを結合する","見た目を整える","複数のセルを一つにまとめて表示します。タイトルや見出しなどに便利です。","複数セルを選択してセルの結合を使うと、一つの大きなセルのように扱えます。ただしデータ表で多用すると並べ替えや集計がしにくくなることがあります。"],
["行・列を追加／削除する","表・シートを整理する","表の途中に項目を増やしたり、不要な行・列を削除したりできます。","行番号や列番号を右クリックすると追加・削除などを選べます。すでに表を作った後で項目を増やしたい場合にもよく使います。"],
["シートを追加・名前変更する","表・シートを整理する","一つのExcelファイルの中に複数のシートを作り、資料を分けて管理できます。","画面下部のシートタブから追加できます。「売上」「在庫」「設定」など用途ごとに名前を付けると整理しやすくなります。"]
];

function card(item,i){
 return `<a class="card" href="#detail-${i}"><span class="num">${String(i+1).padStart(2,"0")} / ${item[1]}</span><h3>${item[0]}</h3><p>${item[2]}</p></a>`;
}
document.getElementById("homeCards").innerHTML=items.map(card).join("");

const groups={};
items.forEach((x,i)=>(groups[x[1]]??=[]).push(card(x,i)));
document.getElementById("listCards").innerHTML=Object.entries(groups).map(([g,c])=>`<h2>${g}</h2><div class="cards">${c.join("")}</div>`).join("");

function show(){
 document.querySelectorAll(".page").forEach(x=>x.style.display="none");
 let h=location.hash||"#home";
 if(h==="#home"){document.getElementById("home").style.display="block";return}
 if(h==="#list"){document.getElementById("list").style.display="block";return}
 let m=h.match(/^#detail-(\d+)$/);
 if(m&&items[m[1]]){
  let x=items[m[1]];
  document.getElementById("detail").innerHTML=
  `<a class="back" href="#list">← 操作一覧へ戻る</a>
   <h1>${x[0]}</h1>
   <p>${x[2]}</p>
   <h2>まずはここだけ覚えよう</h2>
   <div class="simple">${x[2]}</div>
   <h2>もう少し詳しく</h2>
   <p>${x[3]}</p>
   <h2>このサイトでの考え方</h2>
   <div class="tip">最初から完璧に覚える必要はありません。「必要になったら調べる」でOKです。</div>
   <a class="btn" href="#list">他の操作を見る →</a>`;
  document.getElementById("detail").style.display="block";return
 }
 location.hash="#home";
}
addEventListener("hashchange",show);show();
</script>
</body>
</html>
